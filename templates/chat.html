<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dobby Crypto Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #0a0e13;
      --panel: #0f1419;
      --panel-2: #141a24;
      --panel-3: #1a2332;
      --border: #1f2937;
      --text: #e7edf3;
      --muted: #8b96a8;
      --accent: #3b82f6;
      --accent-bright: #60a5fa;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --gradient: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
      line-height: 1.6;
      overflow: hidden;
    }

    .app {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 350px;
      grid-template-rows: auto 1fr auto;
      height: 100dvh;
      gap: 12px;
      padding: 12px;
    }

    @media (max-width: 768px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }

    /* Header */
    .header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      backdrop-filter: blur(10px);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 36px;
      height: 36px;
      background: var(--gradient);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      color: white;
    }

    .title {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.5px;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .header-right {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .trend-badge {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      color: var(--muted);
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .trend-badge span {
      color: var(--accent-bright);
      font-weight: 600;
    }

    /* Main Chat Area */
    .chat-container {
      grid-column: 1;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .chat::-webkit-scrollbar {
      width: 6px;
    }

    .chat::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .chat::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    .msg-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      max-width: 90%;
      word-wrap: break-word;
      line-height: 1.5;
      font-size: 14px;
    }

    .msg.user {
      background: var(--panel-3);
      margin-left: auto;
      border-color: var(--accent);
      color: var(--text);
    }

    .msg.ai {
      background: var(--panel-2);
      margin-right: auto;
      border-color: var(--border);
    }

    .msg a {
      color: var(--accent-bright);
      text-decoration: none;
      border-bottom: 1px solid var(--accent-bright);
    }

    .msg a:hover {
      text-decoration: underline;
    }

    .msg-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .msg-btn {
      font-size: 12px;
      padding: 4px 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .msg-btn:hover {
      background: var(--panel-3);
      color: var(--accent-bright);
      border-color: var(--accent);
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      padding: 10px 12px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: blink 1.3s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }

    /* Sidebar */
    .sidebar {
      grid-column: 2;
      grid-row: 2;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .sidebar-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
    }

    .trending-item {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .trending-item:hover {
      background: var(--panel-3);
      border-color: var(--accent);
    }

    .trending-name {
      font-weight: 600;
      color: var(--accent-bright);
    }

    .trending-symbol {
      color: var(--muted);
      font-size: 12px;
    }

    /* Composer */
    .composer {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .input-wrapper {
      display: flex;
      gap: 8px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      transition: border-color 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: var(--accent);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      min-height: 44px;
      max-height: 100px;
      resize: none;
      padding: 8px;
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .send-btn {
      background: var(--gradient);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 13px;
    }

    .send-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .control-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    select, input[type="range"], input[type="number"] {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    select:hover, input[type="range"]:hover {
      border-color: var(--accent);
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: var(--accent);
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .checkbox-wrapper:hover {
      border-color: var(--accent);
    }

    .checkbox-wrapper label {
      cursor: pointer;
      font-size: 12px;
      color: var(--text);
    }

    /* Outputs Display */
    .outputs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .output-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .output-text {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
    }

    .output-actions {
      display: flex;
      gap: 6px;
    }

    .copy-btn, .tweet-btn {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .copy-btn:hover, .tweet-btn:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .copy-btn.copied {
      background: var(--success);
      color: white;
      border-color: var(--success);
    }

    /* Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 100%;
      color: var(--muted);
      text-align: center;
    }

    .empty-icon {
      font-size: 48px;
      opacity: 0.3;
    }

    .empty-text {
      font-size: 14px;
      max-width: 200px;
    }

  </style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="logo">D</div>
        <div>
          <div class="title">Dobby Crypto Chat</div>
        </div>
        <div class="status-indicator"></div>
      </div>
      <div class="header-right">
        <div class="trend-badge">
          🔥 <span id="trendText">Loading...</span>
        </div>
      </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-container">
      <div class="chat" id="chat">
        <div class="empty-state">
          <div class="empty-icon">💬</div>
          <div class="empty-text">Start by entering a crypto topic to get AI-generated content</div>
        </div>
      </div>
    </div>

    <!-- Sidebar with Trending -->
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">📈 Trending</div>
        <div id="trendingList">
          <div style="color: var(--muted); font-size: 12px;">Loading trends...</div>
        </div>
      </div>
      
      <div class="sidebar-section">
        <div class="sidebar-title">⚡ Quick Tips</div>
        <div style="font-size: 12px; color: var(--muted); line-height: 1.6;">
          • Use Pro Mode for detailed analysis<br>
          • Adjust temperature for creativity<br>
          • Click trending to analyze coins
        </div>
      </div>
    </div>

    <!-- Composer -->
    <div class="composer">
      <div class="input-wrapper">
        <textarea id="input" placeholder="Enter crypto topic... (e.g., Solana ecosystem growth)" rows="1"></textarea>
        <button class="send-btn" id="send">Send</button>
      </div>

      <div class="controls">
        <div class="control-group">
          <label class="control-label">Style</label>
          <select id="style">
            <option value="meme">🎭 Meme</option>
            <option value="education" selected>📚 Education</option>
            <option value="engagement">💬 Engagement</option>
            <option value="news">📰 News</option>
          </select>
        </div>

        <div class="control-group">
          <div class="checkbox-wrapper">
            <input type="checkbox" id="proMode">
            <label for="proMode">✨ Pro</label>
          </div>
        </div>

        <div class="control-group">
          <div class="checkbox-wrapper">
            <input type="checkbox" id="hashtags" checked>
            <label for="hashtags">#️⃣ Tags</label>
          </div>
        </div>

        <div class="control-group">
          <label class="control-label">Creativity</label>
          <input type="range" id="temperature" min="0.2" max="1.5" step="0.1" value="0.7" style="width: 100%;">
        </div>

        <div class="control-group">
          <label class="control-label">Outputs</label>
          <input type="number" id="numOutputs" min="1" max="3" value="1" style="width: 60px;">
        </div>
      </div>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const styleSel = document.getElementById("style");
    const proMode = document.getElementById("proMode");
    const hashtags = document.getElementById("hashtags");
    const temperature = document.getElementById("temperature");
    const numOutputs = document.getElementById("numOutputs");
    const trendText = document.getElementById("trendText");
    const trendingList = document.getElementById("trendingList");

    let currentTrending = [];

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function addMsg(content, who = "ai", isMultiple = false) {
      if (document.querySelector(".empty-state")) {
        document.querySelector(".empty-state").remove();
      }

      const group = el("div", "msg-group");
      
      if (isMultiple) {
        content.forEach((reply, idx) => {
          const msg = el("div", "msg ai");
          msg.innerHTML = `<div class="output-text">${escapeHtml(reply)}</div>
            <div class="msg-actions">
              <button class="msg-btn copy-btn" onclick="copyToClipboard('${idx}')">📋 Copy</button>
              <button class="msg-btn tweet-btn" onclick="openTwitter('${idx}')">𝕏 Tweet</button>
            </div>`;
          msg.dataset.index = idx;
          group.appendChild(msg);
        });
      } else {
        const msg = el("div", `msg ${who}`);
        msg.textContent = content;
        group.appendChild(msg);
      }

      chat.appendChild(group);
      chat.scrollTop = chat.scrollHeight;
    }

    function addTyping() {
      const group = el("div", "msg-group");
      const msg = el("div", "msg ai");
      msg.id = "typing";
      msg.innerHTML = '<div class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
      group.appendChild(msg);
      chat.appendChild(group);
      chat.scrollTop = chat.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById("typing");
      if (t) t.parentElement.remove();
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    window.copyToClipboard = function(idx) {
      const msg = document.querySelector(`[data-index="${idx}"]`);
      const text = msg.querySelector(".output-text").textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = msg.querySelector(".copy-btn");
        btn.textContent = "✓ Copied";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = "📋 Copy";
          btn.classList.remove("copied");
        }, 2000);
      });
    };

    window.openTwitter = function(idx) {
      const msg = document.querySelector(`[data-index="${idx}"]`);
      const text = msg.querySelector(".output-text").textContent;
      const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
      window.open(url, "_blank");
    };

    async function send() {
      const message = input.value.trim();
      if (!message) return;

      input.disabled = true;
      sendBtn.disabled = true;
      addMsg(message, "user");
      addTyping();

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            style: styleSel.value,
            proMode: proMode.checked,
            hashtags: hashtags.checked,
            temperature: parseFloat(temperature.value),
            numOutputs: parseInt(numOutputs.value)
          })
        });

        const data = await res.json();
        removeTyping();

        if (data.trending && data.trending.length > 0) {
          currentTrending = data.trending;
          updateTrending();
          trendText.textContent = data.trending.slice(0, 2).map(t => t.symbol.toUpperCase()).join(", ");
        }

        if (data.replies && data.replies.length > 0) {
          addMsg(data.replies, "ai", true);
        } else if (data.error) {
          addMsg(`Error: ${data.error}`, "ai");
        }
      } catch (e) {
        removeTyping();
        addMsg("Network error. Please try again.", "ai");
      } finally {
        input.value = "";
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    function updateTrending() {
      trendingList.innerHTML = currentTrending.map(t => `
        <div class="trending-item" onclick="analyzeTrending('${t.name}', '${t.symbol}')">
          <div class="trending-name">${t.name}</div>
          <div class="trending-symbol">${t.symbol.toUpperCase()} ${t.market_cap_rank ? `• #${t.market_cap_rank}` : ""}</div>
        </div>
      `).join("");
    }

    window.analyzeTrending = function(name, symbol) {
      input.value = `Deep analysis of ${name} (${symbol})`;
      input.focus();
    };

    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 100) + "px";
    });

    addMsg("👋 Welcome to Dobby! I'm your AI crypto content generator.\n\n✨ Pro Mode: Generate detailed 500-1000 word analyses\n🎭 Styles: Meme, Educational, Engagement, News\n⚙️ Adjust creativity with temperature slider\n\nStart by entering a crypto topic!", "ai");
  </script>
</body>
</html>
